<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Wisdom - Upload</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <!-- Navbar injected by main.js -->

    <div class="container main-content flex items-center" style="justify-content: center; min-height: 80vh;">
        <div class="card" style="width: 100%; max-width: 600px;">
            <div style="margin-bottom: 30px;">
                <h2 style="font-size: 2rem; margin-bottom: 10px;">Upload to Feed</h2>
                <p class="text-muted">Share your moments with the community.</p>
            </div>

            <form id="upload-form">
                <div class="form-group">
                    <label class="form-label">Choose Photo</label>
                    <div class="flex gap-2">
                        <input type="file" id="file-input" class="form-control" accept="image/*" required>
                    </div>
                </div>

                <!-- Preview -->
                <div
                    style="margin-bottom: 20px; height: 300px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: var(--radius-sm);">
                    <img id="preview-img" src="" alt="Preview"
                        style="max-width: 100%; max-height: 100%; display: none;">
                    <span id="preview-placeholder" class="text-muted">Image Preview</span>
                </div>

                <div class="flex gap-4" style="margin-bottom: 20px;">
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label class="form-label">Camera Model</label>
                        <input type="text" id="camera" class="form-control" placeholder="e.g. Sony A7IV">
                    </div>
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label class="form-label">Lens</label>
                        <input type="text" id="lens" class="form-control" placeholder="e.g. 50mm f/1.2 GM">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Caption</label>
                    <textarea id="caption" class="form-control" rows="3" placeholder="What's on your mind?"
                        required></textarea>
                </div>

                <div class="flex gap-4" style="margin-top: 20px;">
                    <a href="index.html" class="btn btn-outline" style="flex: 1;">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Post Photo</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/upload.js"></script>
</body>

</html>
