<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Wisdom - Register</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <!-- Navbar injected by main.js -->

    <div class="container main-content flex items-center" style="justify-content: center; min-height: 80vh;">
        <div class="card" style="width: 100%; max-width: 450px;">
            <div style="text-align: center; margin-bottom: 30px;">
                <h2 style="font-size: 2rem; margin-bottom: 10px;">Join PhotoComm</h2>
                <p class="text-muted">Create an account to share your moments.</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label">Display Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="johndoe" required>
                </div>

                <div class="grid grid-cols-2 gap-4" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" id="confirm-password" class="form-control" placeholder="••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">Sign
                    Up</button>
            </form>

            <div
                style="margin-top: 25px; text-align: center; font-size: 0.95rem; border-top: 1px solid var(--border); padding-top: 20px;">
                <p class="text-muted">Already have an account? <a href="login.html"
                        style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign In</a></p>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
