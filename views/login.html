<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Wisdom - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <!-- Navbar injected by main.js -->

    <div class="container main-content flex items-center" style="justify-content: center; min-height: 80vh;">
        <div class="card" style="width: 100%; max-width: 400px;">
            <div style="text-align: center; margin-bottom: 30px;">
                <h2 style="font-size: 2rem; margin-bottom: 10px;">Welcome Back</h2>
                <p class="text-muted">Enter your details to access your account.</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="admin, alice, or bob" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign In</button>

                <div class="flex items-center gap-3" style="margin: 20px 0;">
                    <hr style="flex-grow: 1; border: 0; border-top: 1px solid var(--border);">
                    <span class="text-muted" style="font-size: 0.85rem;">OR</span>
                    <hr style="flex-grow: 1; border: 0; border-top: 1px solid var(--border);">
                </div>

                <!-- Google Login Wrapper -->
                <!-- REPLACE 'YOUR_GOOGLE_CLIENT_ID' with your actual Google Cloud Console Client ID -->
                <div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID" data-context="signin" data-ux_mode="popup"
                    data-callback="handleCredentialResponse" data-auto_prompt="false">
                </div>

                <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
                    data-text="sign_in_with" data-size="large" data-logo_alignment="left" data-width="360">
                </div>
            </form>

            <div style="margin-top: 20px; text-align: center; font-size: 0.9rem;" class="text-muted">
                <p>Hint: Passwords are all "password"</p>
            </div>

            <div style="margin-top: 20px; text-align: center; border-top: 1px solid var(--border); padding-top: 20px;">
                <p class="text-muted" style="font-size: 0.9rem;">New here? <a href="register.html"
                        style="color: var(--primary); text-decoration: none; font-weight: 600;">Create an Account</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            const button = e.target.querySelector('button');
            const originalText = button.innerText;
            button.disabled = true;
            button.innerText = 'Signing In...';

            const result = await auth.login(u, p);
            if (result.success) {
                window.location.href = 'index.html';
            } else {
                alert(result.message);
                button.disabled = false;
                button.innerText = originalText;
            }
        });
    </script>
</body>

</html>
