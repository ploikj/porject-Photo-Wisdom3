version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=proot
      - DB_NAME=photo_community
    volumes:
      - ./:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=proot
      - MYSQL_DATABASE=photo_community
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
