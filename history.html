<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Wisdom - History</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <!-- Navbar injected by main.js -->

    <div class="container main-content">
        <header class="flex items-center justify-between" style="margin-bottom: 30px;">
            <h1>Upload History</h1>
            <input type="text" id="history-search" placeholder="Search by Author or Title..." class="form-input"
                style="width: 300px; padding: 8px;">
        </header>

        <div class="card">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="text-align: left; border-bottom: 2px solid var(--border); color: var(--text-muted);">
                        <th style="padding: 15px; width: 40%;">Photo Caption</th>
                        <th style="padding: 15px; width: 25%;">Author</th>
                        <th style="padding: 15px; width: 15%;">Stats</th>
                        <th style="padding: 15px; width: 20%; text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="history-list">
                    <!-- History items injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/history.js"></script>
</body>

</html>
