<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Wisdom - Event Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .event-details-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .poster-wrapper {
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .poster-wrapper img {
            width: 100%;
            display: block;
        }

        @media (max-width: 768px) {
            .event-details-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar injected by main.js -->
    <div id="nav-placeholder"></div>

    <main class="container main-content" style="padding-top: 30px; padding-bottom: 60px;">

        <a href="events.html" class="text-muted"
            style="display: inline-flex; align-items: center; gap: 5px; margin-bottom: 20px;">
            ← Back to Events
        </a>

        <div id="event-content" class="card" style="padding: 40px; min-height: 400px;">
            <p class="text-muted text-center">Loading event details...</p>
        </div>

    </main>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/event.js"></script>
</body>

</html>
